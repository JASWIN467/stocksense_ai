[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense-ai"
version = "2.0.0"
authors = [
  { name="StockSense AI Team" },
]
description = "Intelligent Demand Forecasting & Operations Research Inventory Control System"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flask>=3.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",
    "waitress>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com"
